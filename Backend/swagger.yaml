        401:
          $ref: '#/responses/UnauthorizedError'
        403:
          $ref: '#/responses/ForbiddenError'
        404:
          $ref: '#/responses/NotFoundError"
    put:
      tags:
        - blackbox
      summary: Update blackbox question (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          type: string
          description: Question ID
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/UpdateQuestionDto'
      responses:
        200:
          description: Question updated successfully
          schema:
            type: object
            properties:
              data:
