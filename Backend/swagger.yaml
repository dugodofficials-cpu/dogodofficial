  /products:
    get:
      tags:
        - products
      summary: Get all products
      description: Retrieve paginated list of products with filtering and sorting options
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          type: integer
          description: Page number for pagination
          default: 1
        - name: limit
          in: query
          type: integer
          description: Number of items per page
          default: 10
        - name: search
          in: query
          type: string
          description: Search in product name, description, SKU, or album
        - name: type
          in: query
          type: string
          enum: [DIGITAL, PHYSICAL, BUNDLE]
          description: Filter by product type
        - name: status
          in: query
          type: string
          enum: [DRAFT, ACTIVE, INACTIVE, OUT_OF_STOCK]
          description: Filter by product status
        - name: category
          in: query
          type: string
          description: Filter by category
        - name: tag
          in: query
          type: string
          description: Filter by tag
        - name: minPrice
          in: query
          type: number
          minimum: 0
          description: Minimum price filter
        - name: maxPrice
          in: query
          type: number
          minimum: 0
          description: Maximum price filter
        - name: isActive
          in: query
          type: boolean
          description: Filter by active status
        - name: sortBy
          in: query
          type: string
          enum: [name, price, createdAt]
          default: createdAt
          description: Field to sort by
        - name: sortOrder
          in: query
          type: string
          enum: [asc, desc]
          default: desc
          description: Sort order
      responses:
        200:
          description: Products retrieved successfully
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '#/definitions/Product'
              meta:
                type: object
                properties:
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
                  totalPages:
                    type: integer
        401:
          $ref: '#/responses/UnauthorizedError'
    post:
      tags:
        - products
      summary: Create a new product
      description: Create a new product (digital, physical, or bundle)
      security:
        - bearerAuth: []
      consumes:
        - multipart/form-data
      parameters:
        - name: name
          in: formData
          type: string
          required: true
          description: Product name
        - name: description
          in: formData
          type: string
          required: true
          description: Product description
        - name: sku
          in: formData
          type: string
          required: true
          description: Product SKU
        - name: price
          in: formData
          type: number
          required: true
          minimum: 0
          description: Product price in NGN
        - name: type
          in: formData
          type: string
          required: true
          enum: [DIGITAL, PHYSICAL, BUNDLE]
          description: Product type
        - name: status
          in: formData
          type: string
          enum: [DRAFT, ACTIVE, INACTIVE, OUT_OF_STOCK]
          default: DRAFT
          description: Product status
        - name: categories
          in: formData
          type: string
          required: true
          description: Comma-separated list of categories
        - name: tags
          in: formData
          type: string
          description: Comma-separated list of tags
        - name: images
          in: formData
          type: string
          required: true
          description: Comma-separated list of image URLs
        - name: album
          in: formData
          type: string
          description: Album name (required for digital products)
        - name: albumPrice
          in: formData
          type: number
          minimum: 0
          description: Album price (for digital products)
        - name: duration
          in: formData
          type: string
          description: Duration (required for digital products)
        - name: weight
          in: formData
          type: number
          minimum: 0
          description: Weight in kg (for physical products)
        - name: length
          in: formData
          type: number
          minimum: 0
          description: Length in cm (for physical products)
        - name: width
          in: formData
          type: number
          minimum: 0
          description: Width in cm (for physical products)
        - name: height
          in: formData
          type: number
          minimum: 0
          description: Height in cm (for physical products)
        - name: sizes
          in: formData
          type: string
          description: Comma-separated list of sizes (for physical products)
        - name: color
          in: formData
          type: string
          description: Color (for physical products)
        - name: stockQuantity
          in: formData
          type: number
          minimum: 0
          description: Stock quantity (for physical products)
        - name: lowStockThreshold
          in: formData
          type: number
          minimum: 0
          description: Low stock threshold
        - name: bundleItems
          in: formData
          type: string
          description: JSON string of bundle items (for bundle products)
        - name: bundlePrice
          in: formData
          type: number
          minimum: 0
          description: Manual bundle price in NGN (required for bundle products)
        - name: isCustomizable
          in: formData
          type: boolean
          description: Whether bundle is customizable
        - name: minItems
          in: formData
          type: number
          minimum: 1
          description: Minimum items for bundle
        - name: maxItems
          in: formData
          type: number
          minimum: 1
          description: Maximum items for bundle
        - name: isActive
          in: formData
          type: boolean
          default: true
          description: Whether product is active
        - name: audioFile
          in: formData
          type: file
          description: Audio file for digital products
      responses:
        201:
          description: Product created successfully
          schema:
            type: object
            properties:
              message:
                type: string
              data:
                type: object
                properties:
                  product:
