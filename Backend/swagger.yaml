        403:
          $ref: '#/responses/ForbiddenError"

definitions:
  CouponType:
    type: string
    enum:
      - percentage
      - fixed_amount

  CouponStatus:
    type: string
    enum:
      - active
      - expired
      - disabled

  CouponConditions:
    type: object
    properties:
      applicableProducts:
        type: array
        items:
          type: string
      applicableCategories:
        type: array
        items:
          type: string
      excludedProducts:
        type: array
        items:
          type: string
      excludedCategories:
        type: array
        items:
          type: string
      firstPurchaseOnly:
        type: boolean

  CreateCouponDto:
    type: object
    required:
      - code
      - type
      - value
      - description
      - startDate
      - endDate
    properties:
      code:
        type: string
      type:
        $ref: '#/definitions/CouponType'
      value:
        type: number
        minimum: 0
      description:
        type: string
      minimumPurchase:
        type: number
        minimum: 0
      maximumDiscount:
        type: number
        minimum: 0
      usageLimit:
        type: number
        minimum: 0
      startDate:
        type: string
        format: date-time
      endDate:
        type: string
        format: date-time
      conditions:
        $ref: '#/definitions/CouponConditions'

  UpdateCouponDto:
    allOf:
      - $ref: '#/definitions/CreateCouponDto'
      - type: object
        properties:
          status:
            $ref: '#/definitions/CouponStatus'

  ValidateCouponDto:
    type: object
    required:
      - code
      - cartTotal
    properties:
      code:
        type: string
      cartTotal:
        type: number
        minimum: 0
      productIds:
        type: array
        items:
          type: string
      categoryIds:
        type: array
        items:
          type: string
      isFirstPurchase:
        type: boolean

  Coupon:
    allOf:
      - $ref: '#/definitions/CreateCouponDto'
      - type: object
        required:
          - _id
          - status
          - usageCount
          - createdAt
          - updatedAt
        properties:
          _id:
            type: string
          status:
            $ref: '#/definitions/CouponStatus'
          usageCount:
            type: number
            minimum: 0
          createdAt:
            type: string
            format: date-time
          updatedAt:
            type: string
            format: date-time

  users:
    type: object
    properties:
      _id:
        type: string
      email:
        type: string
      password:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      phone:
        type: string
      role:
        type: string
      isActive:
        type: boolean
      lastLoginAt:
        type: string
        format: date-time
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time

  createUser:
    type: object
    required:
      - email
      - password
      - firstName
      - lastName
    properties:
      email:
        type: string
      password:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      phone:
        type: string
      role:
        type: string
      isActive:
        type: boolean

  countries:
    type: object
    properties:
      _id:
        type: string
      name:
        type: string
      code:
        type: string
      phoneCode:
        type: string
      currency:
        type: string
      region:
        type: array
        items:
          type: string
      isActive:
        type: boolean
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time

  createCountry:
    type: object
    required:
      - name
      - code
      - phoneCode
      - currency
      - region
    properties:
      name:
        type: string
      code:
        type: string
      phoneCode:
        type: string
      currency:
        type: string
      region:
        type: array
        items:
          type: string
      isActive:
        type: boolean

  cart:
    type: object
    properties:
      _id:
        type: string
      user:
        type: string
      items:
        type: array
        items:
          $ref: '#/definitions/cartItem'
      status:
        type: string
        enum: [active, abandoned, completed, expired]
      sessionId:
        type: string
      ipAddress:
        type: string
      userAgent:
        type: string
      expiresAt:
        type: string
        format: date-time
      notes:
        type: string
      metadata:
        type: object
      selectedShippingMethod:
        type: string
      shippingEstimates:
        type: array
        items:
          $ref: '#/definitions/shippingEstimate'
      appliedDiscounts:
        type: array
        items:
          $ref: '#/definitions/appliedDiscount'
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time

  cartItem:
    type: object
    properties:
      product:
        type: string
      quantity:
        type: number
        minimum: 1
      selectedOptions:
        type: object
      notes:
        type: string

  shippingEstimate:
    type: object
    properties:
      provider:
        type: string
      method:
        type: string
      cost:
        type: number
        minimum: 0
      estimatedDays:
        type: number
        minimum: 0
      isAvailable:
        type: boolean
      restrictions:
        type: array
        items:
          type: string

  appliedDiscount:
    type: object
    properties:
      code:
        type: string
      type:
        type: string
        enum: [percentage, fixed, shipping]
      value:
        type: number
        minimum: 0
      description:
        type: string
      expiresAt:
        type: string
        format: date-time
      minimumPurchase:
        type: number
        minimum: 0
      maximumDiscount:
        type: number
        minimum: 0
      metadata:
        type: object

  createCart:
    type: object
    required:
      - user
    properties:
      user:
        type: string
      items:
        type: array
        items:
          $ref: '#/definitions/cartItem'
      sessionId:
        type: string
      ipAddress:
        type: string
      userAgent:
        type: string
      expiresAt:
        type: string
        format: date-time
      notes:
        type: string
      metadata:
        type: object

  updateCart:
    type: object
    properties:
      status:
        type: string
        enum: [active, abandoned, completed, expired]
      selectedShippingMethod:
        type: string
      shippingEstimates:
        type: array
        items:
          $ref: '#/definitions/shippingEstimate'
      notes:
        type: string
      metadata:
        type: object

  addItem:
    type: object
    required:
      - item
    properties:
      item:
        $ref: '#/definitions/cartItem'

  updateItem:
    type: object
    required:
      - quantity
    properties:
      quantity:
        type: number
        minimum: 1
      selectedOptions:
        type: object
      notes:
        type: string

  applyDiscount:
    type: object
    required:
      - code
    properties:
      code:
        type: string

  updateShippingMethod:
    type: object
    required:
      - method
    properties:
      method:
        type: string

  Permission:
