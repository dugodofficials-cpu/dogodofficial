        maxLength: 500
      secret:
        type: string
        description: The secret revealed when the question is answered correctly
        maxLength: 1000
      order:
        type: integer
        description: The sequence order of the question
        minimum: 1
      isActive:
        type: boolean
        description: Whether the question is active and available for users
      createdAt:
        type: string
        format: date-time
        description: When the question was created
      updatedAt:
        type: string
