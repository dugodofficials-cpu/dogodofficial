          $ref: '#/responses/ForbiddenError"
        404:
          $ref: '#/responses/NotFoundError"
    delete:
      tags:
        - blackbox
      summary: Delete blackbox question (Admin only)
      description: Delete a question (only if no users have answered it)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          type: string
          description: Question ID
      responses:
        200:
          description: Question deleted successfully
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/BlackboxQuestion'
              message:
                type: string
        401:
          $ref: '#/responses/UnauthorizedError"
        403:
          $ref: '#/responses/ForbiddenError"

  /blackbox/questions/reorder:
    post:
      tags:
        - blackbox
      summary: Reorder blackbox questions (Admin only)
      description: Automatically reorder questions to maintain sequential order
      security:
        - bearerAuth: []
      responses:
        200:
          description: Questions reordered successfully
          schema:
            type: object
            properties:
              message:
                type: string
        401:
          $ref: '#/responses/UnauthorizedError"
        403:
