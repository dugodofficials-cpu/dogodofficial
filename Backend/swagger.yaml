swagger: '2.0'
info:
  title: Dugod Service API
  version: 1.0.0
  description: API documentation for Dugod Service

securityDefinitions:
  bearerAuth:
    type: apiKey
    name: Authorization
    in: header
    description: |
      Authentication can be provided in one of these ways:
      1. Bearer token in Authorization header: 'Bearer {token}'
      2. Cookie in Cookie header: 'Authorization={token}'
      3. Cookie in request cookies object
    x-bearer-format: JWT

tags:
  - name: users
    description: Users API
  - name: countries
    description: Countries API
  - name: auth
    description: Authentication API
  - name: cart
    description: Shopping Cart API
  - name: orders
    description: Orders API
  - name: payments
    description: Payments API
  - name: products
    description: Products API
  - name: roles
    description: Role Management API
  - name: shipping
    description: Shipping API
  - name: coupons
    description: Coupon Management API
  - name: email
    description: Email Service API
  - name: blackbox
    description: Blackbox Questions and Secrets API

paths:
  /coupons:
    get:
      tags:
        - coupons
      summary: Get all coupons (Admin only)
      security:
        - bearerAuth: []
      responses:
        200:
          description: Successful operation
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '#/definitions/Coupon'
              message:
                type: string
        401:
          $ref: '#/responses/UnauthorizedError'
        403:
          $ref: '#/responses/ForbiddenError'
    post:
      tags:
        - coupons
      summary: Create a new coupon (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/CreateCouponDto'
      responses:
        201:
          description: Coupon created successfully
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/Coupon'
              message:
                type: string
        400:
          $ref: '#/responses/BadRequestError'
        401:
          $ref: '#/responses/UnauthorizedError'
        403:
          $ref: '#/responses/ForbiddenError'

  /coupons/{id}:
    get:
      tags:
        - coupons
      summary: Get coupon by ID (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          type: string
      responses:
        200:
          description: Successful operation
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/Coupon'
              message:
                type: string
        401:
          $ref: '#/responses/UnauthorizedError'
        403:
          $ref: '#/responses/ForbiddenError'
        404:
          $ref: '#/responses/NotFoundError'
    put:
      tags:
        - coupons
      summary: Update coupon (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          type: string
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/UpdateCouponDto'
      responses:
        200:
          description: Coupon updated successfully
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/Coupon'
              message:
                type: string
        400:
          $ref: '#/responses/BadRequestError'
        401:
          $ref: '#/responses/UnauthorizedError'
        403:
          $ref: '#/responses/ForbiddenError'
        404:
          $ref: '#/responses/NotFoundError'
    delete:
      tags:
        - coupons
      summary: Delete coupon (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          type: string
      responses:
        200:
          description: Coupon deleted successfully
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/Coupon'
              message:
                type: string
        401:
          $ref: '#/responses/UnauthorizedError'
        403:
          $ref: '#/responses/ForbiddenError'
        404:
          $ref: '#/responses/NotFoundError'

  /coupons/code/{code}:
    get:
      tags:
        - coupons
      summary: Get coupon by code
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          type: string
      responses:
        200:
          description: Successful operation
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/Coupon'
              message:
                type: string
        401:
          $ref: '#/responses/UnauthorizedError'
        404:
          $ref: '#/responses/NotFoundError'

  /coupons/validate:
    post:
      tags:
        - coupons
      summary: Validate a coupon
      security:
        - bearerAuth: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/ValidateCouponDto'
      responses:
        200:
          description: Validation result
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  isValid:
                    type: boolean
                  discount:
                    type: number
                  message:
                    type: string
              message:
                type: string
        400:
          $ref: '#/responses/BadRequestError'
        401:
          $ref: '#/responses/UnauthorizedError'

  /users:
    get:
      tags:
        - users
      summary: Find All Users
      responses:
        200:
          description: 'OK'
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '#/definitions/users'
              message:
                type: string
        500:
          description: 'Server Error'

    post:
      tags:
        - users
      summary: Add User
      parameters:
        - name: body
          in: body
          description: user Data
          required: true
          schema:
            $ref: '#/definitions/createUser'
      responses:
        201:
          description: 'Created'
        400:
          description: 'Bad Request'
        409:
          description: 'Conflict'
        500:
          description: 'Server Error'

  /users/{id}:
    get:
      tags:
        - users
      summary: Find User By Id
      parameters:
        - name: id
          in: path
          description: User Id
          required: true
          type: string
      responses:
        200:
          description: 'OK'
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/users'
              message:
                type: string
        409:
          description: 'Conflict'
        500:
          description: 'Server Error'

    put:
      tags:
        - users
      summary: Update User By Id
      parameters:
        - name: id
          in: path
          description: user Id
          required: true
          type: string
        - name: body
          in: body
          description: user Data
          required: true
          schema:
            $ref: '#/definitions/createUser'
      responses:
        200:
          description: 'OK'
        400:
          description: 'Bad Request'
        409:
          description: 'Conflict'
        500:
          description: 'Server Error'

    delete:
      tags:
        - users
      summary: Delete User By Id
      parameters:
        - name: id
          in: path
          description: user Id
          required: true
          type: string
      responses:
        200:
          description: 'OK'
        409:
          description: 'Conflict'
        500:
          description: 'Server Error'

  /countries:
    get:
      tags:
        - countries
      summary: Find All Countries
      parameters:
        - name: page
          in: query
          description: Page number for pagination
          required: false
          type: integer
          default: 1
        - name: limit
          in: query
          description: Number of items per page
          required: false
          type: integer
          default: 10
          maximum: 100
        - name: search
          in: query
          description: Search term for country name, code, currency, phone code, or region
          required: false
          type: string
        - name: sortBy
          in: query
          description: Field to sort by
          required: false
          type: string
          enum: [name, code, currency, createdAt]
          default: name
        - name: sortOrder
          in: query
          description: Sort order
          required: false
          type: string
          enum: [asc, desc]
          default: asc
      responses:
        200:
          description: 'OK'
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '#/definitions/countries'
              meta:
                type: object
                properties:
                  total:
                    type: integer
                    description: Total number of countries
                  page:
                    type: integer
                    description: Current page number
                  limit:
                    type: integer
                    description: Number of items per page
                  totalPages:
                    type: integer
                    description: Total number of pages
              message:
                type: string
        400:
          description: 'Bad Request'
        500:
          description: 'Server Error'

    post:
      tags:
        - countries
      summary: Add Country
      parameters:
        - name: body
          in: body
          description: Country Data
          required: true
          schema:
            $ref: '#/definitions/createCountry'
      responses:
        201:
          description: 'Created'
        400:
          description: 'Bad Request'
        409:
          description: 'Conflict'
        500:
          description: 'Server Error'

  /countries/{id}:
    get:
      tags:
        - countries
      summary: Find Country By Id
      parameters:
        - name: id
          in: path
          description: Country Id
          required: true
          type: string
      responses:
        200:
          description: 'OK'
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/countries'
              message:
                type: string
        409:
          description: 'Conflict'
        500:
          description: 'Server Error'

    put:
      tags:
        - countries
      summary: Update Country By Id
      parameters:
        - name: id
          in: path
          description: Country Id
          required: true
          type: string
        - name: body
          in: body
          description: Country Data
          required: true
          schema:
            $ref: '#/definitions/createCountry'
      responses:
        200:
          description: 'OK'
        400:
          description: 'Bad Request'
        409:
          description: 'Conflict'
        500:
          description: 'Server Error'

    delete:
      tags:
        - countries
      summary: Delete Country By Id
      parameters:
        - name: id
          in: path
          description: Country Id
          required: true
          type: string
      responses:
        200:
          description: 'OK'
        409:
          description: 'Conflict'
        500:
          description: 'Server Error'

  /countries/code/{code}:
    get:
      tags:
        - countries
      summary: Find Country By Code
      parameters:
        - name: code
          in: path
          description: Country Code
          required: true
          type: string
      responses:
        200:
          description: 'OK'
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/countries'
              message:
                type: string
        409:
          description: 'Conflict'
        500:
          description: 'Server Error'

  /auth/signup:
    post:
      tags:
        - auth
      summary: Register a new user
      parameters:
        - name: body
          in: body
          description: User registration data
          required: true
          schema:
            $ref: '#/definitions/createUser'
      responses:
        201:
          description: 'Created'
        400:
          description: 'Bad Request'
        409:
          description: 'Conflict'
        500:
          description: 'Server Error'

  /auth/signin:
    post:
      tags:
        - auth
      summary: Login user
      parameters:
        - name: body
          in: body
          description: User login credentials
          required: true
          schema:
            type: object
            properties:
              email:
                type: string
                description: User Email
              password:
                type: string
                description: User Password
            required:
              - email
              - password
      responses:
        200:
          description: 'OK'
          schema:
            type: object
            properties:
              token:
                type: string
              user:
                $ref: '#/definitions/users'
        400:
          description: 'Bad Request'
        401:
          description: 'Unauthorized'
        500:
          description: 'Server Error'

  /auth/logout:
    post:
      tags:
        - auth
      summary: Logout user
      security:
        - bearerAuth: []
      responses:
        200:
          description: 'OK'
        401:
          description: 'Unauthorized'
        500:
          description: 'Server Error'

  /auth/me:
    get:
      tags:
        - auth
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        200:
          description: 'OK'
          schema:
            $ref: '#/definitions/users'
        401:
          description: 'Unauthorized'
        500:
          description: 'Server Error'

  /auth/verify-email/{token}:
    get:
      tags:
        - auth
      summary: Verify user email address
      parameters:
        - name: token
          in: path
          description: Email verification token
          required: true
          type: string
      responses:
        200:
          description: 'OK'
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  user:
                    $ref: '#/definitions/users'
                  token:
                    type: string
              message:
                type: string
        400:
          description: 'Bad Request'
        500:
          description: 'Server Error'

  /auth/resend-verification:
    post:
      tags:
        - auth
      summary: Resend email verification
      parameters:
        - name: body
          in: body
          description: Email for verification resend
          required: true
          schema:
            type: object
            properties:
              email:
                type: string
                description: User Email
            required:
              - email
      responses:
        200:
          description: 'OK'
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  message:
                    type: string
              message:
                type: string
        400:
          description: 'Bad Request'
        404:
          description: 'Not Found'
        500:
          description: 'Server Error'

  /auth/check-verification:
    get:
      tags:
        - auth
      summary: Check email verification status
      parameters:
        - name: email
          in: query
          description: User email to check
          required: true
          type: string
      responses:
        200:
          description: 'OK'
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  isVerified:
                    type: boolean
                  status:
                    type: string
                  message:
                    type: string
              message:
                type: string
        400:
          description: 'Bad Request'
        404:
          description: 'Not Found'
        500:
          description: 'Server Error'

  /auth/forgot-password:
    post:
      tags:
        - auth
      summary: Send forgot password email
      parameters:
        - name: body
          in: body
          description: Email for password reset
          required: true
          schema:
            type: object
            properties:
              email:
                type: string
                description: User Email
            required:
              - email
      responses:
        200:
          description: 'OK'
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  message:
                    type: string
              message:
                type: string
        400:
          description: 'Bad Request'
        500:
          description: 'Server Error'

  /auth/reset-password:
    post:
      tags:
        - auth
      summary: Reset password with token
      parameters:
        - name: body
          in: body
          description: Password reset data
          required: true
          schema:
            type: object
            properties:
              token:
                type: string
                description: Password reset token
              password:
                type: string
                description: New password
            required:
              - token
              - password
      responses:
        200:
          description: 'OK'
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  message:
                    type: string
              message:
                type: string
        400:
          description: 'Bad Request'
        500:
          description: 'Server Error'

  /auth/verify-reset-token/{token}:
    get:
      tags:
        - auth
      summary: Verify password reset token validity
      parameters:
        - name: token
          in: path
          description: Password reset token
          required: true
          type: string
      responses:
        200:
          description: 'OK'
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  valid:
                    type: boolean
                  message:
                    type: string
              message:
                type: string
        400:
          description: 'Bad Request'
        500:
          description: 'Server Error'

  /cart:
    get:
      tags:
        - cart
      summary: Get all carts (admin only)
      security:
        - bearerAuth: []
      responses:
        200:
          description: 'OK'
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '#/definitions/cart'
              message:
                type: string
        401:
          description: 'Unauthorized'
        500:
          description: 'Server Error'
    post:
      tags:
        - cart
      summary: Create new cart
      security:
        - bearerAuth: []
      parameters:
        - name: body
          in: body
          description: Cart Data
          required: true
          schema:
            $ref: '#/definitions/createCart'
      responses:
        201:
          description: 'Created'
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/cart'
              message:
                type: string
        400:
          description: 'Bad Request'
        401:
          description: 'Unauthorized'
        500:
          description: 'Server Error'

  /cart/active:
    get:
      tags:
        - cart
      summary: Get user's active cart
      security:
        - bearerAuth: []
      responses:
        200:
          description: 'OK'
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/cart'
              message:
                type: string
        401:
          description: 'Unauthorized'
        404:
          description: 'Not Found'
        500:
          description: 'Server Error'

  /cart/user/{userId}/active:
    get:
      tags:
        - cart
      summary: Get specific user's active cart
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          description: User ID
          required: true
          type: string
      responses:
        200:
          description: 'OK'
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/cart'
              message:
                type: string
        401:
          description: 'Unauthorized'
        404:
          description: 'Not Found'
        500:
          description: 'Server Error'

  /cart/add:
    post:
      tags:
        - cart
      summary: Add item to cart
      security:
        - bearerAuth: []
      parameters:
        - name: body
          in: body
          description: Cart Item Data
          required: true
          schema:
            $ref: '#/definitions/addItem'
      responses:
        200:
          description: 'OK'
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/cart'
              message:
                type: string
        400:
          description: 'Bad Request'
        401:
          description: 'Unauthorized'
        500:
          description: 'Server Error'

  /cart/{id}:
    put:
      tags:
        - cart
      summary: Update cart
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: Cart ID
          required: true
          type: string
        - name: body
          in: body
          description: Cart Update Data
          required: true
          schema:
            $ref: '#/definitions/updateCart'
      responses:
        200:
          description: 'OK'
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/cart'
              message:
                type: string
        400:
          description: 'Bad Request'
        401:
          description: 'Unauthorized'
        404:
          description: 'Not Found'
        500:
          description: 'Server Error'
    delete:
      tags:
        - cart
      summary: Delete cart
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: Cart ID
          required: true
          type: string
      responses:
        200:
          description: 'OK'
        401:
          description: 'Unauthorized'
        404:
          description: 'Not Found'
        500:
          description: 'Server Error'

  /cart/{id}/items/{productId}:
    put:
      tags:
        - cart
      summary: Update item in cart
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: Cart ID
          required: true
          type: string
        - name: productId
          in: path
          description: Product ID
          required: true
          type: string
        - name: body
          in: body
          description: Item Update Data
          required: true
          schema:
            $ref: '#/definitions/updateItem'
      responses:
        200:
          description: 'OK'
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/cart'
              message:
                type: string
        400:
          description: 'Bad Request'
        401:
          description: 'Unauthorized'
        404:
          description: 'Not Found'
        500:
          description: 'Server Error'
    delete:
      tags:
        - cart
      summary: Remove item from cart
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: Cart ID
          required: true
          type: string
        - name: productId
          in: path
          description: Product ID
          required: true
          type: string
      responses:
        200:
          description: 'OK'
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/cart'
              message:
                type: string
        401:
          description: 'Unauthorized'
        404:
          description: 'Not Found'
        500:
          description: 'Server Error'

  /cart/{id}/discounts:
    post:
      tags:
        - cart
      summary: Apply discount to cart
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: Cart ID
          required: true
          type: string
        - name: body
          in: body
          description: Discount Data
          required: true
          schema:
            $ref: '#/definitions/applyDiscount'
      responses:
        200:
          description: 'OK'
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/cart'
              message:
                type: string
        400:
          description: 'Bad Request'
        401:
          description: 'Unauthorized'
        404:
          description: 'Not Found'
        500:
          description: 'Server Error'

  /cart/{id}/discounts/{code}:
    delete:
      tags:
        - cart
      summary: Remove discount from cart
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: Cart ID
          required: true
          type: string
        - name: code
          in: path
          description: Discount Code
          required: true
          type: string
      responses:
        200:
          description: 'OK'
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/cart'
              message:
                type: string
        401:
          description: 'Unauthorized'
        404:
          description: 'Not Found'
        500:
          description: 'Server Error'

  /cart/{id}/shipping:
    put:
      tags:
        - cart
      summary: Update shipping method
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: Cart ID
          required: true
          type: string
        - name: body
          in: body
          description: Shipping Method Data
          required: true
          schema:
            $ref: '#/definitions/updateShippingMethod'
      responses:
        200:
          description: 'OK'
          schema:
            type: object
            properties:
              data:
                $ref: '#/definitions/cart'
              message:
                type: string
        400:
          description: 'Bad Request'
        401:
          description: 'Unauthorized'
        404:
          description: 'Not Found'
        500:
          description: 'Server Error'

  /cart/user/{userId}:
    get:
      tags:
        - cart
      summary: Get user's carts
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          description: User ID
