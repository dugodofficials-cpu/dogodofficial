      description: Submit an answer to a question and receive the secret if correct
      security:
        - bearerAuth: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/AnswerQuestionDto'
      responses:
        200:
          description: Answer processed successfully
          schema:
